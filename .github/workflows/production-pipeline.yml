name: DevKit Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_ENV: 'test'

jobs:
  # -------------------------------------------------------------
  # JOB 1: Code Quality, Typecheck & ESLint
  # -------------------------------------------------------------
  quality-and-typecheck:
    name: 🔍 TypeScript & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Strict TypeScript Compilation
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: ESLint & Next.js Core Web Vitals
        working-directory: ./frontend
        run: npm run lint

  # -------------------------------------------------------------
  # JOB 2: Security & Automated Test Suite
  # -------------------------------------------------------------
  security-and-tests:
    name: 🛡️ Security Engine & Automated Test Suite
    runs-on: ubuntu-latest
    needs: quality-and-typecheck
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Execute 61-Test Automated Suite (Security, DLP, Payments, RBAC)
        working-directory: ./frontend
        run: npm run test

      - name: Dependency Security Vulnerability Audit
        working-directory: ./frontend
        run: npm audit --audit-level=critical || true

  # -------------------------------------------------------------
  # JOB 3: Optimized Next.js Production Build
  # -------------------------------------------------------------
  production-build:
    name: ⚡ Next.js Production Build (Standalone)
    runs-on: ubuntu-latest
    needs: security-and-tests
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: ./frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build Next.js Application
        working-directory: ./frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://devkit.market
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_live_placeholder
          RAZORPAY_KEY_ID: rzp_live_placeholder
          RAZORPAY_KEY_SECRET: rzp_secret_placeholder
          RAZORPAY_WEBHOOK_SECRET: rzp_webhook_placeholder
          MONGODB_URI: mongodb://localhost:27017/devkit_build_mock
          NEXTAUTH_SECRET: devkit_production_build_secret_key_0123456789
        run: npm run build

      - name: Verify Standalone Deployment Bundle
        working-directory: ./frontend
        run: |
          test -f .next/standalone/server.js && echo "✓ Standalone server.js verified" || (echo "✗ Missing standalone output" && exit 1)

  # -------------------------------------------------------------
  # JOB 4: 7-Stage Pre-Production Verification Gate
  # -------------------------------------------------------------
  production-verification:
    name: 🚀 7-Stage Pre-Production Verification Audit
    runs-on: ubuntu-latest
    needs: production-build
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Run Master Verification Pipeline
        working-directory: ./frontend
        run: npm run verify:prod

  # -------------------------------------------------------------
  # JOB 5: Production Readiness Gate
  # -------------------------------------------------------------
  production-readiness-gate:
    name: 🏆 Production Readiness Gate (Ready to Upload)
    runs-on: ubuntu-latest
    needs:
      - quality-and-typecheck
      - security-and-tests
      - production-build
      - production-verification
    steps:
      - name: Deployment Gate Passed
        run: |
          echo "=========================================================="
          echo "  ✅ ALL CI/CD PIPELINE STAGES PASSED SUCCESSFULLY        "
          echo "  Codebase is verified, hardened, and ready for upload!   "
          echo "=========================================================="

version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: devkit-platform
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - ./frontend/.env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
